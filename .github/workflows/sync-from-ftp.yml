name: Sync from FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-from-ftp.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download site from FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          FTP_PORT="${FTP_PORT:-21}"
          FTP_SERVER="${FTP_SERVER#ftp://}"
          FTP_SERVER="${FTP_SERVER#ftps://}"
          FTP_SERVER="${FTP_SERVER#sftp://}"
          FTP_SERVER="${FTP_SERVER%/}"

          LIST=$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<'EOF'
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit yes
          cls -1
          bye
          EOF
          )

          echo "FTP root listing:"
          echo "$LIST"

          REMOTE_DIR="."
          if echo "$LIST" | grep -qx "public_html"; then
            REMOTE_DIR="public_html"
          elif echo "$LIST" | grep -qx "www"; then
            REMOTE_DIR="www"
          elif echo "$LIST" | grep -qx "httpdocs"; then
            REMOTE_DIR="httpdocs"
          fi
          echo "Using remote directory: $REMOTE_DIR"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          set xfer:clobber true
          set cmd:fail-exit yes
          cd $REMOTE_DIR
          pwd
          mirror --verbose --parallel=4 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            --exclude-glob node_modules/ \
            --exclude-glob .DS_Store \
            . .
          bye
          EOF

      - name: Commit and push downloaded files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1

          find . -mindepth 2 -name .git -type d -print -exec rm -rf {} +

          while IFS= read -r big; do
            [ -n "$big" ] || continue
            echo "::warning title=skipped large file::$big"
            rm -f "$big"
          done < <(find . -type f -size +95M -print)

          git add -A
          if git diff --cached --quiet; then
            echo "::error::No site files were left to commit after download."
            exit 1
          fi
          echo "Files to commit: $(git diff --cached --name-only | wc -l)"
          git commit -m "Sync site files from FTP server."

          attempt=1
          while [ "$attempt" -le 8 ]; do
            set +e
            git push origin HEAD:main > /tmp/push.out 2>&1
            code=$?
            set -e
            cat /tmp/push.out
            if [ "$code" -eq 0 ]; then
              exit 0
            fi

            paths=$(
              {
                sed -n 's/.*[Ff]ile \(.*\) is [0-9.][0-9.]* MB.*/\1/p' /tmp/push.out
                sed -n 's/^remote:[[:space:]]*path:[[:space:]]*//p' /tmp/push.out | sed 's/:.*//'
                grep -oE 'path: [^ :]+' /tmp/push.out | sed 's/^path: //'
              } | sed '/^$/d' | sort -u
            )
            if [ -z "$paths" ]; then
              grep -E 'remote:|error:|fatal:|rejected|GH00' /tmp/push.out | head -n 40 | while IFS= read -r line; do
                echo "::error title=git push::$line"
              done
              exit "$code"
            fi

            echo "Removing blocked paths and retrying push ($attempt):"
            echo "$paths"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              echo "::warning title=skipped blocked file::$path"
              git rm -r --cached --ignore-unmatch -- "$path" || true
              rm -rf -- "$path"
            done <<< "$paths"
            git add -A
            if git diff --cached --quiet; then
              echo "::error::Nothing left to push after removing blocked files."
              exit 1
            fi
            git commit -m "Skip files GitHub refused during FTP sync."
            attempt=$((attempt + 1))
          done
          echo "::error::git push still failed after removing blocked files."
          exit 1
